<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>ChatGPT Prompt-Bound Alert</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      width: 250px;
      margin: 0;
      padding: 14px;
      background: #151515;
      color: #f3f3f3;
    }
    h1 { font-size: 15px; margin: 0 0 8px; }
    p { font-size: 12px; line-height: 1.4; color: #cfcfcf; margin: 0 0 12px; }
    button {
      width: 100%;
      border: 1px solid #555;
      border-radius: 8px;
      padding: 9px 10px;
      background: #f3f3f3;
      color: #111;
      font-weight: 650;
      cursor: pointer;
    }
    #status { min-height: 18px; margin-top: 9px; font-size: 12px; color: #d8d8d8; }
  </style>
</head>
<body>
  <h1>ChatGPT Prompt-Bound Alert</h1>
  <p>Completion alerts emit both channels and use the session title + a response preview.</p>
  <button id="test">Test sound + notification</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
